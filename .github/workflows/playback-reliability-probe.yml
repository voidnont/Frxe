name: Playback Reliability Probe

on:
  push:
    branches:
      - fix/playback-reliability-067

jobs:
  resolver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run prefetch priority regression
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.frxe.music.playback.PlaybackPrefetchPolicyTest
      - name: Probe live NewPipe resolver
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.frxe.music.source.LiveNewPipeProbeTest

  live-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe current InnerTube contract
        id: innertube
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys, urllib.request, urllib.error

          runtime = pathlib.Path('app/src/main/java/com/frxe/music/source/YouTubeAudioResolverRuntime.kt').read_text()
          challenge = pathlib.Path('app/src/main/java/com/frxe/music/source/YouTubeChallengeHandler.kt').read_text()
          api_key = re.search(r'INNERTUBE_WEB_KEY\s*=\s*\n?\s*"([^"]+)"', runtime).group(1)
          client_version = re.search(r'WEB_CLIENT_VERSION\s*=\s*\n?\s*"([^"]+)"', runtime).group(1)
          user_agent = re.search(r'YOUTUBE_WEB_USER_AGENT\s*=\s*\n?\s*"([^"]+)"', challenge).group(1)
          video_id = 'jNQXAC9IVRw'
          endpoint = f'https://www.youtube.com/youtubei/v1/player?prettyPrint=false&key={api_key}'
          payload = {
              'context': {'client': {
                  'clientName': 'WEB',
                  'clientVersion': client_version,
                  'hl': 'en',
                  'gl': 'US'
              }},
              'videoId': video_id,
              'playbackContext': {'contentPlaybackContext': {'html5Preference': 'HTML5_PREF_WANTS'}}
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(endpoint, data=data, method='POST', headers={
              'Content-Type': 'application/json; charset=utf-8',
              'Origin': 'https://www.youtube.com',
              'User-Agent': user_agent,
              'X-YouTube-Client-Name': '1',
              'X-YouTube-Client-Version': client_version,
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  root = json.load(r)
          except urllib.error.HTTPError as e:
              print('InnerTube HTTP', e.code, e.read().decode(errors='replace')[:1000])
              raise

          playability = root.get('playabilityStatus') or {}
          status = playability.get('status', '')
          reason = playability.get('reason', '')
          streaming = root.get('streamingData') or {}
          formats = (streaming.get('adaptiveFormats') or []) + (streaming.get('formats') or [])
          audio = [f for f in formats if str(f.get('mimeType', '')).lower().startswith('audio/')]
          direct = [f for f in audio if str(f.get('url', '')).startswith(('http://', 'https://'))]
          ciphered = [f for f in audio if f.get('signatureCipher') or f.get('cipher')]
          print(f'InnerTube status={status!r} reason={reason!r} audio={len(audio)} direct={len(direct)} ciphered={len(ciphered)}')
          if status != 'OK':
              sys.exit('InnerTube playability is not OK')
          if not direct:
              sys.exit('FRXE InnerTube path has no direct audio URL to consume')
          print('InnerTube direct audio probe: PASS')
          PY

      - name: Probe yt-dlp resolver attempts
        id: ytdlp
        continue-on-error: true
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --upgrade yt-dlp
          URL='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          set +e
          OUT=$(yt-dlp --no-playlist --no-warnings -f 'bestaudio[ext=m4a]/bestaudio/best' --get-url "$URL" 2>&1)
          CODE=$?
          if [ "$CODE" -ne 0 ] || ! printf '%s' "$OUT" | grep -Eq '^https?://'; then
            OUT=$(yt-dlp --no-playlist --no-warnings -f 'bestaudio/best' --extractor-args 'youtube:player_client=web_safari' --get-url "$URL" 2>&1)
            CODE=$?
          fi
          if [ "$CODE" -ne 0 ] || ! printf '%s' "$OUT" | grep -Eq '^https?://'; then
            OUT=$(yt-dlp --no-playlist --no-warnings -f 'bestaudio/best' --extractor-args 'youtube:player_client=android_vr' --get-url "$URL" 2>&1)
            CODE=$?
          fi
          printf '%s\n' "$OUT" | tail -20
          if [ "$CODE" -ne 0 ] || ! printf '%s' "$OUT" | grep -Eq '^https?://'; then
            exit 1
          fi
          echo 'yt-dlp fallback probe: PASS'

      - name: Probe ZEXL conversion fallback
        id: zexl
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request

          base = 'https://zexl.onrender.com'
          source = 'https://www.youtube.com/watch?v=jNQXAC9IVRw'

          def request(path, method='GET', body=None, timeout=90):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'Frxe/0.6.7',
                  **({'Content-Type': 'application/json; charset=utf-8'} if data is not None else {})
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          job = None
          last_error = None
          for attempt in range(4):
              try:
                  job = request('/api/convert', 'POST', {'url': source, 'format': 'mp3'})
                  break
              except Exception as e:
                  last_error = e
                  print(f'ZEXL start attempt {attempt + 1} failed: {e}')
                  time.sleep(8)
          if job is None:
              raise last_error

          job_id = str(job.get('id', '')).strip()
          if not job_id:
              sys.exit(f'ZEXL returned no job id: {job}')
          print('ZEXL job', job_id, 'initial status', job.get('status'))

          for poll in range(90):
              status = str(job.get('status', '')).strip().lower()
              if status == 'ready':
                  download = str(job.get('downloadUrl') or '').strip()
                  if download.startswith(('http://', 'https://')):
                      file_url = download
                  elif download.startswith('/'):
                      file_url = base + download
                  else:
                      file_url = f'{base}/api/jobs/{job_id}/file'
                  print('ZEXL ready; file URL:', file_url)
                  if not file_url.startswith(('http://', 'https://')):
                      sys.exit('ZEXL returned an invalid playback URL')
                  print('ZEXL fallback probe: PASS')
                  break
              if status == 'error':
                  sys.exit(f"ZEXL conversion error: {job.get('error')} [{job.get('errorCode')}]")
              time.sleep(2)
              job = request(f'/api/jobs/{job_id}')
          else:
              sys.exit('ZEXL did not become ready within 180 seconds')
          PY

      - name: Report live resolver outcomes
        shell: bash
        run: |
          echo 'InnerTube: ${{ steps.innertube.outcome }}'
          echo 'yt-dlp:    ${{ steps.ytdlp.outcome }}'
          echo 'ZEXL:      ${{ steps.zexl.outcome }}'
          if [ '${{ steps.ytdlp.outcome }}' != 'success' ] && [ '${{ steps.zexl.outcome }}' != 'success' ]; then
            echo 'No verified fallback beyond the challenged InnerTube path.'
            exit 1
          fi
