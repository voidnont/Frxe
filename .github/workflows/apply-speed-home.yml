name: Apply Home refresh speed patch

on:
  push:
    branches:
      - perf/frxe-067-speed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/frxe-067-speed
      - name: Patch Home refresh gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/frxe/music/ui/FrxeViewModel.kt')
          s = p.read_text()

          old = 'import com.frxe.music.recommendation.RecommendationRepository\n'
          new = 'import com.frxe.music.recommendation.HomeRefreshPolicy\nimport com.frxe.music.recommendation.RecommendationRepository\n'
          if 'import com.frxe.music.recommendation.HomeRefreshPolicy\n' not in s:
              if old not in s:
                  raise SystemExit('RecommendationRepository import anchor missing')
              s = s.replace(old, new, 1)

          old = '''    private var searchJob:\n        Job? = null\n'''
          new = '''    private var searchJob:\n        Job? = null\n\n    private var lastRemoteHomeKey:\n        String? = null\n'''
          if 'private var lastRemoteHomeKey:' not in s:
              if old not in s:
                  raise SystemExit('searchJob anchor missing')
              s = s.replace(old, new, 1)

          anchor = '''                    val recommendations =\n                        recommendationRepository\n                            .home(\n                                recent,\n                                saved,\n                                likes\n                            )\n'''
          replacement = '''                    val remoteHomeKey =\n                        HomeRefreshPolicy.key(\n                            history = recent,\n                            library = saved,\n                            likedIds = likes\n                        )\n\n                    if (\n                        !HomeRefreshPolicy.shouldRefresh(\n                            previousKey = lastRemoteHomeKey,\n                            nextKey = remoteHomeKey\n                        )\n                    ) {\n                        return@collectLatest\n                    }\n\n                    lastRemoteHomeKey = remoteHomeKey\n\n                    val recommendations =\n                        recommendationRepository\n                            .home(\n                                recent,\n                                saved,\n                                likes\n                            )\n'''
          if 'val remoteHomeKey =' not in s:
              if anchor not in s:
                  raise SystemExit('home recommendation anchor missing')
              s = s.replace(anchor, replacement, 1)

          p.write_text(s)
          PY
          rm .github/workflows/apply-speed-home.yml
          git config user.name void
          git config user.email voidnont@proton.me
          git add app/src/main/java/com/frxe/music/ui/FrxeViewModel.kt .github/workflows/apply-speed-home.yml
          git commit -m "perf: avoid duplicate remote Home refreshes"
          git push origin HEAD:perf/frxe-067-speed
