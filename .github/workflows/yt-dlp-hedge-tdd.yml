name: FRXE yt-dlp hedge TDD

on:
  push:
    branches:
      - fix/yt-dlp-hedged-fallback-067

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run resolver hedge regression test
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.frxe.music.source.PlaybackResolverChainTest
