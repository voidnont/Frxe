name: Build FRXE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable release APK
        env:
          FRXE_CI_RELEASE_DEBUG_SIGNING: '1'
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk Frxe-0.6.7-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRXE-0.6.7-APK
          path: Frxe-0.6.7-android.apk
          if-no-files-found: error
          retention-days: 30
