name: Verify Frxe 0.6.7 ZEXL fallback

on:
  push:
    branches:
      - frxe-0.6.7-zexl-playback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Package clean 0.6.7 source
        shell: bash
        run: |
          git ls-files \
            | grep -Ev '^\.github/' \
            | grep -Ev '(^|/)local\.properties$' \
            | grep -Ev '\.apk$' \
            | zip -q Frxe-0.6.7-source.zip -@

      - name: Verify source package exclusions
        shell: bash
        run: |
          unzip -Z1 Frxe-0.6.7-source.zip > source-files.txt
          if grep -E '(^|/)(\.github|\.git|\.frxe-tools|\.frxe-signing|build-logs|build)/' source-files.txt; then
            echo 'Source package contains an excluded path.' >&2
            exit 1
          fi
          if grep -E '\.apk$|(^|/)local\.properties$' source-files.txt; then
            echo 'Source package contains a generated/private file.' >&2
            exit 1
          fi

      - name: Upload clean source package
        uses: actions/upload-artifact@v4
        with:
          name: Frxe-0.6.7-source
          path: Frxe-0.6.7-source.zip
          if-no-files-found: error
          retention-days: 14
