name: FRXE Speed CI

on:
  push:
    branches:
      - perf/frxe-067-speed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run speed tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests '*CatalogSearchCacheTest' --tests '*CatalogHedgeRunnerTest' --tests '*PlaybackPrefetchWindowPolicyTest' --tests '*PlaybackPrefetchCacheMultiTest' --tests '*HomeRefreshPolicyTest'
