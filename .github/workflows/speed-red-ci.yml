name: FRXE Speed CI

on:
  push:
    branches:
      - perf/frxe-067-speed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run full debug verification
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Package fast APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FRXE-0.6.7-fast.apk
          sha256sum FRXE-0.6.7-fast.apk | tee FRXE-0.6.7-fast.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FRXE-0.6.7-fast-APK
          path: |
            FRXE-0.6.7-fast.apk
            FRXE-0.6.7-fast.apk.sha256
          if-no-files-found: error
