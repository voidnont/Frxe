name: Build FRXE 0.6.7 APK

on:
  push:
    branches:
      - build/frxe-0.6.7-apk-final2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Package APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FRXE-0.6.7-debug.apk
          sha256sum FRXE-0.6.7-debug.apk | tee FRXE-0.6.7-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FRXE-0.6.7-APK-final
          path: |
            FRXE-0.6.7-debug.apk
            FRXE-0.6.7-debug.apk.sha256
          if-no-files-found: error
