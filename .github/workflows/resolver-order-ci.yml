name: Resolver Order CI

on:
  push:
    branches:
      - fix/youtube-music-first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run resolver order unit test
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.frxe.music.source.PlaybackResolverOrderTest
