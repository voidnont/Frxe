name: FRXE Island Speed CI

on:
  push:
    branches:
      - fix/island-speed-067

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Island and catalog regression tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests com.frxe.music.island.IslandPresentationPolicyTest
          --tests com.frxe.music.island.IslandArtworkPolicyTest
          --tests com.frxe.music.island.IslandWaveformPolicyTest
          --tests com.frxe.music.source.CatalogLoadPolicyTest
